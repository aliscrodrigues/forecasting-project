    "datasetsforecast>=1.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=25.0.1",
    "seaborn>=0.13.2",
    "torch>=2.7.0",
]
